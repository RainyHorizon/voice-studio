services:
  voice-studio:
    image: ghcr.io/rainyhorizon/voice-studio:${VOICE_STUDIO_VERSION:-1.2.0}
    build:
      context: .
      args:
        VERSION: ${VOICE_STUDIO_VERSION:-1.2.0}
        REVISION: ${VOICE_STUDIO_REVISION:-local}
        CREATED: ${VOICE_STUDIO_CREATED:-local}
    container_name: voice-studio
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:${VOICE_STUDIO_HOST_PORT:-8765}:8765"
    environment:
      VOICE_STUDIO_CREDENTIALS_MODE: env
      VOICE_STUDIO_VERSION: ${VOICE_STUDIO_VERSION:-1.2.0}
      VOICE_STUDIO_ALLOWED_ORIGINS: http://127.0.0.1:${VOICE_STUDIO_HOST_PORT:-8765},http://localhost:${VOICE_STUDIO_HOST_PORT:-8765}
      VOICE_STUDIO_GATEWAY_KEY: ${VOICE_STUDIO_GATEWAY_KEY:?Set VOICE_STUDIO_GATEWAY_KEY in .env}
      VOICE_STUDIO_DASHSCOPE_API_KEY: ${VOICE_STUDIO_DASHSCOPE_API_KEY:-}
      VOICE_STUDIO_VOLCENGINE_API_KEY: ${VOICE_STUDIO_VOLCENGINE_API_KEY:-}
      VOICE_STUDIO_VOLCENGINE_OPENAPI_ACCESS_KEY: ${VOICE_STUDIO_VOLCENGINE_OPENAPI_ACCESS_KEY:-}
      VOICE_STUDIO_VOLCENGINE_OPENAPI_SECRET_KEY: ${VOICE_STUDIO_VOLCENGINE_OPENAPI_SECRET_KEY:-}
      VOICE_STUDIO_VOLCENGINE_PROJECT_NAME: ${VOICE_STUDIO_VOLCENGINE_PROJECT_NAME:-}
      VOICE_STUDIO_MINIMAX_API_KEY: ${VOICE_STUDIO_MINIMAX_API_KEY:-}
      VOICE_STUDIO_MIMO_API_KEY: ${VOICE_STUDIO_MIMO_API_KEY:-}
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      org.opencontainers.image.source: https://github.com/RainyHorizon/voice-studio
      org.opencontainers.image.description: Voice Studio local voice gateway
