name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @(
            'start.ps1',
            'update.ps1',
            'build-windows-release.ps1',
            'build-windows-portable.ps1'
          )

          foreach ($script in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $script))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$script must be saved as UTF-8 with BOM for Windows PowerShell 5.1."
            }

            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script failed to parse: $($errors | Out-String)"
            }
          }

      - name: Validate Unix shell scripts
        if: runner.os != 'Windows'
        run: bash -n start.sh update.sh

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest==8.3.5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          VOICE_STUDIO_CREDENTIALS_MODE: env
          VOICE_STUDIO_GATEWAY_KEY: ci-test-gateway-key
        run: python -m pytest -q tests

  docker-build:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: voice-studio:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^VOICE_STUDIO_GATEWAY_KEY=.*/VOICE_STUDIO_GATEWAY_KEY=ci-test-gateway-key/' .env
          docker compose config --quiet
