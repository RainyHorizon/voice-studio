name: Build Release Assets

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Locate FFmpeg distribution
        id: ffmpeg
        shell: pwsh
        run: |
          $searchRoots = @(
            'C:\Program Files\FFmpeg',
            'C:\ProgramData\chocolatey\lib',
            'C:\ProgramData\chocolatey\bin'
          )
          $resolvedBin = $null
          foreach ($root in $searchRoots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $ffmpegFiles = Get-ChildItem -LiteralPath $root -Filter 'ffmpeg.exe' -File -Recurse -ErrorAction SilentlyContinue
            foreach ($ffmpegFile in $ffmpegFiles) {
              $bin = $ffmpegFile.Directory.FullName
              $ffprobe = Join-Path $bin 'ffprobe.exe'
              $license = Get-ChildItem -LiteralPath (Split-Path -Parent $bin) -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('LICENSE', 'COPYING.GPLv3', 'COPYING.GPLv2', 'COPYING.LGPLv3', 'COPYING.LGPLv2.1') } |
                Select-Object -First 1
              if ((Test-Path -LiteralPath $ffprobe -PathType Leaf) -and $license) {
                $resolvedBin = $bin
                break
              }
            }
            if ($resolvedBin) { break }
          }
          if (-not $resolvedBin) {
            throw '未找到同时包含 ffmpeg.exe、ffprobe.exe 和许可证文件的 FFmpeg 发布目录。'
          }
          "FFMPEG_BIN=$resolvedBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows light package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .\build-windows-release.ps1 -Version ($env:RELEASE_VERSION -replace '^v', '')
      - name: Build Windows portable package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: .\build-windows-portable.ps1 -Version ($env:RELEASE_VERSION -replace '^v', '') -FfmpegBinDirectory $env:FFMPEG_BIN
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            output/releases/Voice-Studio-*-Windows.zip
            output/releases/Voice-Studio-*-Windows.zip.sha256
            output/releases/Voice-Studio-*-Windows-Portable.zip
            output/releases/Voice-Studio-*-Windows-Portable.zip.sha256

  unix:
    name: ${{ matrix.os }} source package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          else
            brew install ffmpeg
          fi
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Create source package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          PLATFORM_LABEL: ${{ matrix.label }}
        run: |
          version="${RELEASE_VERSION#v}"
          package="Voice-Studio-${version}-${PLATFORM_LABEL}"
          mkdir -p "dist/${package}/frontend" "dist/${package}/backend" "dist/${package}/data/audio"
          cp -R backend/app "dist/${package}/backend/"
          cp backend/requirements.txt "dist/${package}/backend/"
          cp -R frontend/dist "dist/${package}/frontend/"
          cp start.sh update.sh README.md LICENSE .gitattributes "dist/${package}/"
          chmod +x "dist/${package}/start.sh" "dist/${package}/update.sh"
          printf '%s\n' "$version" > "dist/${package}/VERSION"
          find "dist/${package}" -type f \
            ! -path "dist/${package}/data/*" \
            ! -name '.voice-studio-files.txt' \
            -print | sed "s#^dist/${package}/##" | LC_ALL=C sort > "dist/${package}/.voice-studio-files.txt"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
          fi
      - name: Upload Unix package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, unix]
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_VERSION}"
          if [[ "${tag}" != v* ]]; then tag="v${tag}"; fi
          gh release create "$tag" release-assets/* --repo "${GITHUB_REPOSITORY}" \
            --title "Voice Studio ${tag}" --generate-notes --verify-tag
